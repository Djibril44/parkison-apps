services:
  - type: web
    name: parkinson-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
    envVarGroups:
      - name: database
        envVars:
          - key: DATABASE_URL
            sync: false
