<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Parkinson Screening</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-brain"></i>
                </div>
                <h1>Créer un compte</h1>
                <p>Rejoignez notre plateforme de dépistage</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="nom">
                        <i class="fas fa-user"></i>
                        Nom complet
                    </label>
                    <input 
                        type="text" 
                        id="nom" 
                        name="nom" 
                        placeholder="Votre nom" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="votre@email.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div class="password-field">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                            minlength="6"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small>Minimum 6 caractères</small>
                </div>

                <div class="form-group">
                    <label for="confirm">
                        <i class="fas fa-lock"></i>
                        Confirmer le mot de passe
                    </label>
                    <div class="password-field">
                        <input 
                            type="password" 
                            id="confirm" 
                            name="confirm" 
                            placeholder="••••••••" 
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-agreement">
                    <label>
                        <input type="checkbox" required>
                        <span>Je suis médecin ou professionnel de santé</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-user-plus"></i>
                    Créer mon compte
                </button>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </form>

            <div class="auth-footer">
                <p>Vous avez déjà un compte?</p>
                <a href="/login" class="link-register">Se connecter</a>
            </div>
        </div>

        <div class="auth-side">
            <div class="auth-features">
                <h2>Avantages de l'inscription</h2>
                <ul class="features-list">
                    <li>
                        <i class="fas fa-check-circle"></i>
                        <span>Accès complet à la plateforme</span>
                    </li>
                    <li>
                        <i class="fas fa-check-circle"></i>
                        <span>Gestion sécurisée des patients</span>
                    </li>
                    <li>
                        <i class="fas fa-check-circle"></i>
                        <span>Historique et traçabilité</span>
                    </li>
                    <li>
                        <i class="fas fa-check-circle"></i>
                        <span>Support prioritaire</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleBtn = event.target.closest('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (password !== confirm) {
                errorMessage.textContent = 'Les mots de passe ne correspondent pas';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nom: nom,
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    errorMessage.style.display = 'none';
                    window.location.href = data.redirect;
                } else {
                    errorMessage.textContent = data.message || 'Erreur lors de l\'inscription';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Erreur:', error);
                errorMessage.textContent = 'Une erreur est survenue';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
