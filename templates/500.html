{% extends "base.html" %}

{% block title %}Erreur serveur{% endblock %}

{% block content %}
<div class="fade-in" style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 5rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 2.5rem; color: var(--danger); margin-bottom: 0.5rem;">
        500 - Erreur Serveur
    </h1>
    <p style="color: var(--gray-dark); font-size: 1.1rem; margin-bottom: 2rem;">
        Une erreur est survenue sur le serveur. Veuillez réessayer plus tard.
    </p>
    <a href="/" class="btn btn-primary" style="text-decoration: none;">
        <i class="fas fa-home"></i>
        Retour à l'accueil
    </a>
</div>
{% endblock %}
